<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pet Finder AI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<div class="container">

<h1>แจ้งพบสัตว์หลงด้วย AI</h1>

<form id="petForm">

<div class="form-grid">

<div class="card">

<h3>อัปโหลดรูปสัตว์</h3>

<input type="file" name="image">

<select name="type" required>
<option value="">เลือกประเภท</option>
<option value="หมา">หมา</option>
<option value="แมว">แมว</option>
</select>

<input name="name" placeholder="ชื่อสัตว์">

<input name="location" placeholder="สถานที่">

<input type="hidden" id="lat" name="lat">
<input type="hidden" id="lng" name="lng">

</div>

<div class="card">

<h3>เลือกตำแหน่งบนแผนที่</h3>

<div id="map"></div>

</div>

</div>

<button type="submit">
สร้างประกาศตามหาสัตว์ด้วย AI
</button>

</form>

<h2>รายการสัตว์</h2>

<div id="petList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
